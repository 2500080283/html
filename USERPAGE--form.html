<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USERPAGE--FORM</title>
</head>
<body div style="background-image: url('KL_University_logo.svg');align-items: center;border: 2px solid black;align-items: center;BORDER-RADIUS: 10PX; padding: 20px; margin: 20px;width: full;height: full;">
    <header  div style="background-color: beige;align-items: center;border: 2px solid black;align-items: center;">
        <h1 style="color: black; text-align: center;">USERPAGE--FORM</h1>
    </header>    

    <form DIV style="background-color: rgb(179, 63, 63);align-items: center;border: 2px solid black;align-items: center;BORDER-RADIUS: 10PX; padding: 20px; margin: 20px;">
        <label for="name">USERNAME:</label>
        <input type="text" name="name" placeholder="Enter your name:">
        <br><br>
        <label for="email">EMAIL:</label>
        <input type="email" name="email" placeholder="Enter your email:">
        <br><br>
        <label for="age">AGE:</label>
        <input type="number" name="age" placeholder="Enter your age:">
        <br><br>
        <label for="dob">DATE OF BIRTH:</label>
        <input type="date" name="dob" placeholder="Enter your date of birth:">
        <br><br>
        <label> GENDER </label>
        <input type="radio" name="gender" value="male"> 
        <label for="male">Male</label>
        <input type="radio" name="gender" value="female"> 
        <label for="female">Female</label>
        <br><br>
        <label for="phone">PHONE:</label>
        <input type="tel" name="phone" placeholder="Enter your phone number:">
        <br><br>
        <label for="Department">DEPARTMENT:</label>
        <select name="Department">
            <option value="CSE">CSE</option>
            <option value="AI&DS">AI&DS</option>
            <option value="AI&ML">AI&ML</option>
            <option value="BBA">BBA</option>
            <option value="CS&IT">CS&IT</option>
            <option value="ECE">ECE</option>
            <option value="EEE">EEE</option>
        </select>
        <br><br>
        <label>SKILLS:</label>
        <input type="checkbox" name="skills" value="HTML">
        <label for="HTML">HTML</label>
        <input type="checkbox" name="skills" value="CSS">
        <label for="CSS">CSS</label>
        <input type="checkbox" name="skills" value="JS">
        <label for="JS">JS</label>
        <input type="checkbox" name="skills" value="PHP">
        <label for="PHP">PHP</label>
        <input type="checkbox" name="skills" value="PYTHON">
        <label for="PYTHON">PYTHON</label>
        <input type="checkbox" name="skills" value="JAVA">
        <label for="JAVA">JAVA</label>
        <input type="checkbox" name="skills" value="C++">
        <label for="C++">C++</label>    
        <input type="checkbox" name="skills" value="C">
        <label for="C">C</label>
        <input type="checkbox" name="skills" value="SQL">
        <label for="SQL">SQL</label>
        <input type="checkbox" name="skills" value="REACT">
        <label for="REACT">REACT</label>
        <br><br>
        <label for="address">ADDRESS:</label>
        <textarea name="address" placeholder="Enter your address:"></textarea>
        <br><br>
       <optgroup label="STATE">
        <select name="state">
            <option value="Andhra Pradesh">Andhra Pradesh</option>
            <option value="Arunachal Pradesh">Arunachal Pradesh</option>
            <option value="Assam">Assam</option>
            <option value="Bihar">Bihar</option>
            <option value="Chhattisgarh">Chhattisgarh</option>
            <option value="Goa">Goa</option>
            <option value="Gujarat">Gujarat</option>
            <option value="Haryana">Haryana</option>
            <option value="Himachal Pradesh">Himachal Pradesh</option>
            <option value="Jharkhand">Jharkhand</option>
            <option value="Karnataka">Karnataka</option>
            <option value="Kerala">Kerala</option>
            <option value="Madhya Pradesh">Madhya Pradesh</option>
            <option value="Maharashtra">Maharashtra</option>
            <option value="Manipur">Manipur</option>
            <option value="Meghalaya">Meghalaya</option>
            <option value="Mizoram">Mizoram</option>
            <option value="Nagaland">Nagaland</option>
            <option value="Odisha">Odisha</option>
            <option value="Punjab">Punjab</option>
            <option value="Rajasthan">Rajasthan</option>
            <option value="Sikkim">Sikkim</option>
            <option value="Tamil Nadu">Tamil Nadu</option>
            <option value="Telangana">Telangana</option>
            <option value="Tripura">Tripura</option>
            <option value="Uttar Pradesh">Uttar Pradesh</option>
            <option value="Uttarakhand">Uttarakhand</option>
            <option value="West Bengal">West Bengal</option>    
        </select> 
        </optgroup> 
        <br><br> 
        <input type="submit" name="submit" value="Submit">
        <input type="reset" value="Reset" value="Reset">
    </form>
</body>
</html>
