<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: beige;align-items: center;border: 2px solid black;">

    <form div style="margin: 20px; padding: 20px; border: 1px solid black; background-color: lightgray;">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name">
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
        <br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age">       
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">     
        <br><br>

        <label for="Department">Department:</label>
        <select id="Department" name="Department">
            <option value="HR">HR</option>
            <option value="IT">IT</option>
            <option value="Finance">Finance</option>
            <option value="Marketing">Marketing</option>
        </select>
        <br><br>

        <label>Checkboxes:</label><br>
        <input type="checkbox" id="first year" name="first year" value="first year">
        <label for="first year"> First Year</label><br>  
        <input type="checkbox" id="second year" name="second year" value="second year">
        <label for="second year"> Second Year</label><br>          


        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <br><br>

        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <br><br>

        <label for="female">Female:</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <br><br>

        <input type="submit" value="Submit">
    </form>

</body>
</html>
